[package]
name = "pdfcraft-create"
description = "Create PDFs: blank documents, from images (PNG, JPEG) and from plain text"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-filters = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-fonts = { workspace = true }
# For `image::bmp_with_pixel_offset`, shared with XFA pictures.
pdfcraft-xfa = { workspace = true }
craft-image-codecs = { workspace = true }
craft-jpeg = { workspace = true }
craft-tiff = { workspace = true }
# Keep `image` (no codec features) only for `imageops::resize` of soft masks in `extract.rs`.
image = { version = "0.25", default-features = false }
thiserror = { workspace = true }
# Already in the graph through lopdf; used only to read plain-text files (decode_text).
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
# Already in the graph (pdfcraft-platform, ui-egui); stops a timed-out LibreOffice's whole process
# group, soffice.bin included, without unsafe code.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# An independent CCITT decoder, to check Create PDF's Group 4 images.
hayro-ccitt.workspace = true
hayro-syntax = { workspace = true }
pdfcraft-filters = { workspace = true }
